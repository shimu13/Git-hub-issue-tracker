<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>GitHub Issues Tracker</title>

<script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

<div class="w-full max-w-3xl bg-white p-10 rounded-xl shadow">

<!-- Logo + Title -->

<div class="flex flex-col items-center mb-8">

<img 
src="assets/github-logo.png"
class="w-16 mb-3">

<h1 class="text-2xl font-bold">
GitHub Issues Tracker
</h1>

<p class="text-gray-500">
Sign in to manage your issues
</p>

</div>


<!-- Username -->

<label class="font-medium">
Username
</label>

<input
id="username"
type="text"
placeholder="Enter Username"
class="w-full border rounded-lg p-3 mt-2 mb-1">

<p class="text-sm text-purple-600 mb-4">
Default: admin
</p>


<!-- Password -->

<label class="font-medium">
Password
</label>

<input
id="password"
type="password"
placeholder="Enter Password"
class="w-full border rounded-lg p-3 mt-2 mb-1">

<p class="text-sm text-purple-600 mb-6">
Default: admin123
</p>


<!-- Sign In Button -->

<button
onclick="login()"
class="w-full py-3 rounded-lg text-white font-semibold
bg-gradient-to-r from-purple-600 to-indigo-600">

Sign In

</button>


<!-- OR Section -->

<div class="flex items-center gap-4 my-6">

<hr class="flex-1">

<span class="text-gray-500">
OR
</span>

<hr class="flex-1">

</div>


<!-- Demo Credentials -->

<p class="text-center text-gray-500 mb-3">
Demo Credentials:
</p>

<div class="bg-gray-100 p-4 rounded-lg text-center">

<p>
<strong>Username:</strong> admin
</p>

<p>
<strong>Password:</strong> admin123
</p>

</div>

</div>


<script src="script.js"></script>

</body>
</html>
